<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1265" viewBox="0 0 1700 1265" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B46C1"/>
    </marker>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #1d2433; }
      .subtitle { font-size: 15px; fill: #555; }
      .band { font-size: 13px; font-weight: 700; letter-spacing: 1.2px; fill: #5b6475; }
      .h { font-size: 15px; font-weight: 700; fill: #1d2433; }
      .t { font-size: 13px; fill: #2b3140; }
      .s { font-size: 12px; fill: #555; }
      .mono { font-family: Menlo, Consolas, monospace; font-size: 12px; fill: #2b3140; }
      .tool { fill: #E8F0FB; stroke: #3B6FB6; stroke-width: 1.6; }
      .custom { fill: #FFF1E0; stroke: #D9822B; stroke-width: 1.6; }
      .data { fill: #F2F3F5; stroke: #7A808C; stroke-width: 1.4; }
      .ctx { fill: #FFFFFF; stroke: #9AA1AD; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .gate { fill: #FDECEC; stroke: #C0392B; stroke-width: 1.6; }
      .line { stroke: #444; stroke-width: 1.6; fill: none; }
      .bus { stroke: #6B46C1; stroke-width: 1.8; fill: none; stroke-dasharray: 7 4; }
      .badge { fill: #6B46C1; }
      .badgeT { font-size: 10.5px; font-weight: 700; fill: #fff; }
      .lab { font-size: 12px; fill: #444; font-style: italic; }
      .labP { font-size: 12px; fill: #6B46C1; font-style: italic; font-weight: 600; }
    </style>
  </defs>

  <rect width="1700" height="1265" fill="#ffffff"/>

  <!-- Title -->
  <text x="30" y="44" class="title">Strain-specific GEM reconstruction pipeline: concept</text>
  <text x="30" y="72" class="subtitle">Draft v0.1 · 2026-10-22 · assemblies, AMRBench_QC gene prediction, CarveMe, then species-reference biomass and gap-filling</text>

  <!-- ===== Band: per genome ===== -->
  <rect x="30" y="96" width="1640" height="536" rx="14" fill="#F6FAF6" stroke="#D5E3D5"/>
  <text x="48" y="122" class="band">PER GENOME · 140 NOW, 12,000 LATER (7 SPECIES)</text>

  <!-- Assemblies -->
  <rect x="60" y="160" width="230" height="140" rx="10" class="data"/>
  <text x="74" y="188" class="h">Assemblies</text>
  <text x="74" y="212" class="mono">data/genomes/*/*.fna</text>
  <text x="74" y="232" class="t">samplesheet:</text>
  <text x="74" y="250" class="mono">sample, species, fasta</text>
  <text x="74" y="272" class="t">species selects the reference</text>

  <line x1="290" y1="230" x2="328" y2="230" class="line" marker-end="url(#arr)"/>

  <!-- AMRBench_QC -->
  <rect x="330" y="150" width="320" height="160" rx="10" class="tool"/>
  <text x="344" y="176" class="h">AMRBench_QC (Nextflow)</text>
  <text x="344" y="196" class="mono">gigabiome/AMRBench_QC @ 52001eb</text>
  <text x="344" y="218" class="t">QUAST 5.3.0 · assembly statistics</text>
  <text x="344" y="236" class="t">CheckM2 1.1.0 · completeness, contamination</text>
  <text x="344" y="254" class="t">Bakta 1.12.0 · gene prediction + annotation</text>
  <text x="344" y="272" class="t">Prokka 1.15.6 · optional (--skip_prokka)</text>
  <text x="344" y="294" class="t">Output: proteins (.faa), GFF3, QC reports</text>
  <circle cx="632" cy="168" r="11" class="badge"/><text x="632" y="172" text-anchor="middle" class="badgeT">D1</text>

  <line x1="650" y1="230" x2="688" y2="230" class="line" marker-end="url(#arr)"/>

  <!-- QC gate -->
  <polygon points="690,230 750,170 810,230 750,290" class="gate"/>
  <text x="750" y="226" text-anchor="middle" class="h">QC gate</text>
  <text x="750" y="244" text-anchor="middle" class="s">pass?</text>
  <circle cx="800" cy="180" r="11" class="badge"/><text x="800" y="184" text-anchor="middle" class="badgeT">D2</text>

  <!-- fail branch -->
  <line x1="810" y1="230" x2="858" y2="230" class="line" marker-end="url(#arr)"/>
  <text x="820" y="222" class="lab">fail</text>
  <rect x="860" y="200" width="210" height="60" rx="10" class="data"/>
  <text x="874" y="225" class="h">Excluded from modelling</text>
  <text x="874" y="245" class="t">logged with reason</text>

  <!-- Orchestration context -->
  <rect x="1110" y="150" width="530" height="160" rx="10" class="ctx"/>
  <text x="1124" y="176" class="h">Orchestration (applies to every per-genome step)</text>
  <text x="1124" y="200" class="t">Nextflow DSL2, one task per genome, -resume</text>
  <text x="1124" y="220" class="t">One pinned container per tool; all versions recorded</text>
  <text x="1124" y="240" class="t">Independent per-genome tasks: scales to 12,000 on HPC</text>
  <text x="1124" y="260" class="t">MILP time limit / optimality gap recorded per model</text>
  <text x="1124" y="280" class="t">Species-level preparation runs once and is reused</text>
  <circle cx="1622" cy="168" r="11" class="badge"/><text x="1622" y="172" text-anchor="middle" class="badgeT">D8</text>

  <!-- pass path -->
  <path d="M750,290 V372 H240 V408" class="line" marker-end="url(#arr)"/>
  <text x="300" y="365" class="lab">pass: proteins (.faa) + species</text>

  <!-- CarveMe -->
  <rect x="60" y="410" width="360" height="200" rx="10" class="tool"/>
  <text x="74" y="436" class="h">CarveMe 1.6.6 · carve</text>
  <text x="74" y="460" class="t">DIAMOND: proteins vs CarveMe BiGG DB</text>
  <text x="74" y="478" class="t">Reaction scores from BiGG GPRs</text>
  <text x="74" y="496" class="t">MILP carving of the universe model</text>
  <text x="74" y="514" class="t">   gramneg (Gram−) / grampos (Gram+)</text>
  <text x="74" y="532" class="t">--reference: score bonus for reactions</text>
  <text x="74" y="550" class="t">   shared with the species reference</text>
  <text x="74" y="568" class="t">no -g: gap-filling done downstream</text>
  <text x="74" y="590" class="t">Output: draft model (universal 'Growth')</text>
  <circle cx="402" cy="428" r="11" class="badge"/><text x="402" y="432" text-anchor="middle" class="badgeT">D6</text>
  <circle cx="376" cy="428" r="11" class="badge"/><text x="376" y="432" text-anchor="middle" class="badgeT">D7</text>

  <line x1="420" y1="510" x2="458" y2="510" class="line" marker-end="url(#arr)"/>

  <!-- Biomass replacement -->
  <rect x="460" y="410" width="270" height="200" rx="10" class="custom"/>
  <text x="474" y="436" class="h">Biomass replacement</text>
  <text x="474" y="460" class="t">Remove universal 'Growth' reaction</text>
  <text x="474" y="478" class="t">Insert the species reference biomass</text>
  <text x="474" y="496" class="t">Add reactions making its precursors</text>
  <text x="474" y="514" class="t">that the draft lacks (lipids, cell</text>
  <text x="474" y="532" class="t">wall, lumped pseudo-metabolites,</text>
  <text x="474" y="550" class="t">e.g. iYS854)</text>
  <text x="474" y="572" class="t">Set as the model objective</text>

  <line x1="730" y1="510" x2="768" y2="510" class="line" marker-end="url(#arr)"/>

  <!-- Gap-filling -->
  <rect x="770" y="410" width="360" height="200" rx="10" class="custom"/>
  <text x="784" y="436" class="h">Reference-guided gap-filling</text>
  <text x="784" y="460" class="t">MILP (CarveMe gapFill algorithm)</text>
  <text x="784" y="478" class="t">Pool = harmonised reference + universe</text>
  <text x="784" y="496" class="t">Cost: reference &lt; universe reactions;</text>
  <text x="784" y="514" class="t">homology-scored reactions cheaper</text>
  <text x="784" y="532" class="t">Growth ≥ minimum on the reference</text>
  <text x="784" y="550" class="t">biomass, in the chosen medium</text>
  <text x="784" y="572" class="t">Each added reaction tagged with its</text>
  <text x="784" y="590" class="t">source (reference / universe)</text>
  <circle cx="1112" cy="428" r="11" class="badge"/><text x="1112" y="432" text-anchor="middle" class="badgeT">D9</text>
  <circle cx="1086" cy="428" r="11" class="badge"/><text x="1086" y="432" text-anchor="middle" class="badgeT">D5</text>
  <circle cx="1060" cy="428" r="11" class="badge"/><text x="1060" y="432" text-anchor="middle" class="badgeT">D3</text>

  <line x1="1130" y1="510" x2="1168" y2="510" class="line" marker-end="url(#arr)"/>

  <!-- Model QC -->
  <rect x="1170" y="410" width="250" height="200" rx="10" class="custom"/>
  <text x="1184" y="436" class="h">Model QC &amp; provenance</text>
  <text x="1184" y="460" class="t">Valid SBML; loads in COBRApy</text>
  <text x="1184" y="478" class="t">Grows on the gap-fill medium</text>
  <text x="1184" y="496" class="t">Biomass precursors producible</text>
  <text x="1184" y="514" class="t">Mass and charge balance check</text>
  <text x="1184" y="532" class="t">Gap-fill size, gene count</text>
  <text x="1184" y="554" class="t">Tool versions and parameters</text>
  <text x="1184" y="572" class="t">written into the SBML notes</text>

  <line x1="1420" y1="510" x2="1458" y2="510" class="line" marker-end="url(#arr)"/>

  <!-- Outputs -->
  <rect x="1460" y="410" width="180" height="200" rx="10" class="data"/>
  <text x="1474" y="436" class="h">Outputs</text>
  <text x="1474" y="460" class="mono">&lt;sample&gt;.xml</text>
  <text x="1474" y="478" class="mono">&lt;sample&gt;.json</text>
  <text x="1474" y="500" class="t">gap-fill report</text>
  <text x="1474" y="518" class="t">QC table row</text>
  <text x="1474" y="536" class="t">run summary</text>

  <!-- ===== Reference bus ===== -->
  <path d="M1295,728 V656" class="bus"/>
  <path d="M240,656 H1295" class="bus"/>
  <line x1="240" y1="656" x2="240" y2="614" class="bus" marker-end="url(#arrP)"/>
  <line x1="595" y1="656" x2="595" y2="614" class="bus" marker-end="url(#arrP)"/>
  <line x1="950" y1="656" x2="950" y2="614" class="bus" marker-end="url(#arrP)"/>
  <line x1="1295" y1="656" x2="1295" y2="614" class="bus" marker-end="url(#arrP)"/>
  <text x="252" y="650" class="labP">reference</text>
  <text x="607" y="650" class="labP">biomass module</text>
  <text x="962" y="650" class="labP">pool, costs, medium</text>
  <text x="1307" y="650" class="labP">medium, biomass</text>

  <!-- ===== Band: per species ===== -->
  <rect x="30" y="680" width="1640" height="240" rx="14" fill="#F7F5FF" stroke="#DDD6F3"/>
  <text x="48" y="706" class="band">ONCE PER SPECIES (7×) · REUSED BY EVERY GENOME OF THAT SPECIES</text>

  <!-- Registry -->
  <rect x="60" y="730" width="300" height="170" rx="10" class="data"/>
  <text x="74" y="756" class="h">Reference registry</text>
  <text x="74" y="778" class="mono">references.tsv</text>
  <text x="74" y="798" class="t">species: reference GEM (SBML)</text>
  <text x="74" y="816" class="t">biomass reaction ID</text>
  <text x="74" y="834" class="t">CarveMe universe: gramneg / grampos</text>
  <text x="74" y="852" class="t">gap-filling medium</text>
  <text x="74" y="874" class="t">reference choice per species</text>
  <circle cx="342" cy="748" r="11" class="badge"/><text x="342" y="752" text-anchor="middle" class="badgeT">D4</text>

  <line x1="360" y1="815" x2="398" y2="815" class="line" marker-end="url(#arr)"/>

  <!-- Prepare reference -->
  <rect x="400" y="730" width="650" height="170" rx="10" class="custom"/>
  <text x="414" y="756" class="h">Prepare reference (once per species)</text>
  <text x="414" y="778" class="t">Map reference IDs and compartments to CarveMe's BiGG namespace (e.g. iYS854 'w' compartment)</text>
  <text x="414" y="796" class="t">Extract the biomass reaction and the reactions that synthesise its precursors</text>
  <text x="414" y="814" class="t">Build the gap-fill pool = reference + universe reactions, with a cost per reaction</text>
  <text x="414" y="832" class="t">Define the medium as BiGG exchange reactions</text>
  <text x="414" y="854" class="t">Check: harmonised reference grows on the medium with its own biomass</text>
  <text x="414" y="872" class="t">Check: reference biomass is producible from the pool</text>

  <line x1="1050" y1="815" x2="1098" y2="815" class="line" marker-end="url(#arr)"/>

  <!-- Bundle -->
  <rect x="1100" y="730" width="540" height="170" rx="10" class="data"/>
  <text x="1114" y="756" class="h">Prepared reference bundle (per species)</text>
  <text x="1114" y="778" class="t">harmonised reference model (SBML)</text>
  <text x="1114" y="796" class="t">biomass module: biomass + precursor reactions</text>
  <text x="1114" y="814" class="t">gap-fill pool with reaction costs</text>
  <text x="1114" y="832" class="t">medium definition</text>
  <text x="1114" y="850" class="t">validation report</text>

  <!-- ===== Decisions ===== -->
  <rect x="30" y="944" width="1180" height="236" rx="14" fill="#FFFFFF" stroke="#DDD6F3"/>
  <text x="48" y="972" class="band">OPEN DECISIONS · TO SETTLE BEFORE IMPLEMENTATION</text>

  <g>
    <circle cx="66" cy="1000" r="11" class="badge"/><text x="66" y="1004" text-anchor="middle" class="badgeT">D1</text>
    <text x="86" y="1005" class="t">Protein source for CarveMe: Bakta .faa or Prokka .faa</text>
    <circle cx="66" cy="1032" r="11" class="badge"/><text x="66" y="1036" text-anchor="middle" class="badgeT">D2</text>
    <text x="86" y="1037" class="t">QC thresholds: CheckM2 completeness / contamination, QUAST metrics</text>
    <circle cx="66" cy="1064" r="11" class="badge"/><text x="66" y="1068" text-anchor="middle" class="badgeT">D3</text>
    <text x="86" y="1069" class="t">Gap-filling medium: LB, M9 or species-specific; one or several</text>
    <circle cx="66" cy="1096" r="11" class="badge"/><text x="66" y="1100" text-anchor="middle" class="badgeT">D4</text>
    <text x="86" y="1101" class="t">Reference per species: E. coli and A. baumannii choices; Enterobacter has none</text>
    <circle cx="66" cy="1128" r="11" class="badge"/><text x="66" y="1132" text-anchor="middle" class="badgeT">D5</text>
    <text x="86" y="1133" class="t">Gap-fill costs: reference vs universe vs homology-scored reactions</text>

    <circle cx="646" cy="1000" r="11" class="badge"/><text x="646" y="1004" text-anchor="middle" class="badgeT">D6</text>
    <text x="666" y="1005" class="t">MILP solver: CPLEX / Gurobi (licence) or SCIP (600 s limit)</text>
    <circle cx="646" cy="1032" r="11" class="badge"/><text x="646" y="1036" text-anchor="middle" class="badgeT">D7</text>
    <text x="666" y="1037" class="t">CarveMe --reference-score (default 0.0)</text>
    <circle cx="646" cy="1064" r="11" class="badge"/><text x="646" y="1068" text-anchor="middle" class="badgeT">D8</text>
    <text x="666" y="1069" class="t">Compute environment: HPC scheduler or cloud; container engine</text>
    <circle cx="646" cy="1096" r="11" class="badge"/><text x="646" y="1100" text-anchor="middle" class="badgeT">D9</text>
    <text x="666" y="1101" class="t">Minimum growth rate for gap-filling (CarveMe default 0.1)</text>
  </g>

  <!-- ===== Legend ===== -->
  <rect x="1230" y="944" width="440" height="236" rx="14" fill="#FFFFFF" stroke="#DDD6F3"/>
  <text x="1248" y="972" class="band">LEGEND</text>
  <rect x="1250" y="988" width="34" height="22" rx="5" class="tool"/><text x="1296" y="1004" class="t">Existing tool / pipeline</text>
  <rect x="1250" y="1020" width="34" height="22" rx="5" class="custom"/><text x="1296" y="1036" class="t">Custom step (to be built)</text>
  <rect x="1250" y="1052" width="34" height="22" rx="5" class="data"/><text x="1296" y="1068" class="t">Data / inputs / outputs</text>
  <polygon points="1250,1095 1267,1084 1284,1095 1267,1106" class="gate"/><text x="1296" y="1100" class="t">QC gate</text>
  <circle cx="1267" cy="1127" r="11" class="badge"/><text x="1267" y="1131" text-anchor="middle" class="badgeT">Dn</text><text x="1296" y="1132" class="t">Open decision</text>
  <line x1="1250" y1="1158" x2="1284" y2="1158" class="bus"/><text x="1296" y="1163" class="t">Species reference used by a step</text>

  <!-- Footnote -->
  <text x="30" y="1210" class="s">Verified against CarveMe 1.6.6 source: --reference changes only the carving scores of reactions shared with the reference; -g gap-fills from the universe model only;</text>
  <text x="30" y="1228" class="s">the biomass is the universe 'Growth' reaction. The orange steps implement the requested reference biomass and reference-based gap-filling, which CarveMe does not provide.</text>
  <text x="30" y="1246" class="s">Tool versions for AMRBench_QC are taken from its module definitions at commit 52001eb.</text>
</svg>
