# Environment for every resisto-GEM model-building step (CarveMe, reframed, COBRApy, DIAMOND).
# Python packages are pinned to the exact set the scripts were tested with (pip freeze, 2026-10-22).
#
# CPLEX is NOT included (licensed). After creating this environment, install the CPLEX Python API
# from your licensed CPLEX Studio into it; see docs/solver.md. The pipeline's CHECK_SOLVER step
# verifies the installation before any genome is processed.
#
# diamond is pinned to 2.1.9 because CarveMe 1.6.6's bundled bigg_proteins.dmnd was built with
# DIAMOND build 163 (= v2.1.9; header checked).
name: resisto-gem
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.10
  - diamond=2.1.9
  - pip
  - pip:
      - annotated-types==0.8.0
      - anyio==4.15.1
      - appdirs==1.4.4
      - carveme==1.6.6
      - certifi==2026.10.19
      - cobra==0.30.0
      - depinfo==2.2.0
      - diskcache==5.6.3
      - exceptiongroup==1.3.1
      - future==1.0.0
      - h11==0.16.0
      - httpcore==1.0.9
      - httpx==0.28.1
      - idna==3.20
      - markdown-it-py==4.2.0
      - mdurl==0.1.2
      - mpmath==1.3.0
      - numpy==2.2.6
      - optlang==1.9.1
      - pandas==2.3.3
      - pydantic==2.14.1
      - pydantic_core==2.50.1
      - Pygments==2.21.0
      - PySCIPOpt==6.3.0
      - python-dateutil==3.0.0
      - python-libsbml==5.21.2
      - pytz==2026.5
      - reframed==1.6.0
      - rich==15.0.0
      - ruamel.yaml==0.19.1
      - scipy==1.15.3
      - six==1.17.0
      - swiglpk==5.0.13
      - sympy==1.14.0
      - typing-inspection==0.4.4
      - typing_extensions==4.16.0
      - tzdata==2026.5
